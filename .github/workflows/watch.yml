name: Surveillance logements Fac-Habitat

on:
  schedule:
    # toutes les 10 minutes (GitHub peut decaler de quelques minutes en cas de charge)
    - cron: "*/10 * * * *"
  workflow_dispatch:        # permet de lancer a la main depuis l'onglet Actions
    inputs:
      test:
        description: "Envoyer seulement une notification de test"
        type: boolean
        default: false

permissions:
  contents: write           # necessaire pour reecrire state.json

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier les residences
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST:          ${{ secrets.SMTP_HOST }}
          SMTP_PORT:          ${{ secrets.SMTP_PORT }}
          SMTP_USER:          ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:      ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO:            ${{ secrets.MAIL_TO }}
        run: python check.py ${{ inputs.test && '--test' || '' }}

      - name: Sauvegarder l'etat
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "Aucun changement d'etat a sauvegarder."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/state.json"
          # On se recale toujours sur la derniere version de main (un "Re-run"
          # rejoue un ancien commit, et residences.json a pu etre modifie entre-temps),
          # puis on y pose notre state.json : pas de rebase, donc pas de conflit.
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/state.json" state.json
            if [ -z "$(git status --porcelain state.json)" ]; then
              echo "Etat deja a jour."
              exit 0
            fi
            git add state.json
            git commit -q -m "etat: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push -q origin HEAD:main && exit 0
            echo "Push refuse (tentative $attempt), on recommence..."
            sleep 5
          done
          exit 1
